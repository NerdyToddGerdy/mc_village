<title>Block Village Founding</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap">
<style>
/* Layout: full-bleed isometric canvas; slate HUD boards pinned to the four corners, centre left clear. */
:root{
  --slate:#2F3B37; --slate-a:rgba(47,59,55,0.93); --slate-deep:#232C29;
  --chalk:#ECEAE2; --dim:#B3B8AF;
  --red:#F25C54; --blue:#6FA8DC; --green:#8CC084; --yellow:#E8C547;
  --sky:#A9B8B0;
  --font:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--sky);color:var(--chalk);font-family:var(--font);font-size:15px;line-height:1.35;overflow:hidden;margin:0}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
.hud{position:fixed;inset:0;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));box-sizing:border-box}
.hud-inner{position:relative;height:100%}
.panel{pointer-events:auto;background:var(--slate-a);border:1px solid var(--slate-deep);border-radius:8px;box-shadow:0 2px 0 var(--slate-deep)}
.corner{position:absolute;display:flex;flex-direction:column;gap:8px;max-width:100%}
.tl{left:0;top:0;align-items:flex-start}
.tr{right:0;top:0;align-items:flex-end}
.bl{left:0;bottom:0;align-items:flex-start}
.br{right:0;bottom:0;align-items:flex-end}
button{font:inherit;color:var(--chalk);background:transparent;border:1px solid transparent;border-radius:4px;cursor:pointer;padding:0}
button:hover{background:var(--slate-deep)}
button:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
button[aria-pressed="true"]{background:var(--slate-deep);border-color:var(--chalk)}
.ghost-btn{border-color:var(--chalk);padding:0 12px;min-height:36px}
.num{font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.name{font-size:24px;font-weight:750;font-stretch:78%;line-height:1.1}
.title{font-size:17px;font-weight:750;font-stretch:80%}
#tallies{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 14px}
.tally{display:flex;gap:8px;align-items:center}
.tally .n{font-size:18px;font-weight:650}
.tally .loose{font-size:12px;line-height:1.2}
.tools-wrap{position:relative}
.tools-btn{padding:4px 6px;margin:-4px -6px;min-height:36px}
.tools-drop{display:none;position:absolute;left:-6px;top:100%;padding-top:10px;z-index:5}
.tools-wrap:hover .tools-drop,.tools-wrap:focus-within .tools-drop{display:block}
#toolsList{width:280px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.tgroup{display:flex;flex-direction:column;gap:6px}
.tgroup .gname{font-weight:700}
.tool-row{display:flex;flex-direction:column;gap:3px;font-size:14px}
.tool-row .bar>i{background:var(--chalk)}
.tool-row.low .bar>i{background:var(--yellow)}
.tool-row.low .uses{color:var(--yellow)}
#goals{width:290px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
#goals ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
#goals li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
#goals li.done{color:var(--dim)}
#goals li.now{font-weight:700}
#goals .hint{font-size:13px;color:var(--dim);padding-left:22px;margin-top:-2px}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
#speed{display:flex;gap:2px;padding:4px}
#speed button{width:44px;height:44px;font-weight:650;display:flex;align-items:center;justify-content:center}
#stuck{width:250px;padding:12px 8px 8px}
#stuck .title{color:var(--yellow);padding:0 8px 6px}
#stuck button{width:100%;text-align:left;padding:8px;display:flex;gap:10px;align-items:flex-start;min-height:44px}
#stuck .who{font-weight:700;display:block}
#toasts{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;max-width:calc(100% - 640px);min-width:260px}
.toast{padding:10px 10px 10px 16px;display:flex;gap:14px;align-items:center}
#sel{width:330px;max-width:100%;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.bar{height:6px;background:var(--slate-deep);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:6px;background:var(--blue);border-radius:3px}
.reason{display:flex;gap:8px;align-items:center;color:var(--yellow);font-weight:650}
.recipes{display:flex;flex-direction:column;gap:2px}
.recipe{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}
.recipe button{min-height:36px;padding:0 12px;border-color:var(--dim)}
.queue{display:flex;flex-wrap:wrap;gap:6px}
.queue button{min-height:32px;padding:0 10px;border-color:var(--dim);font-size:13px}
#toolbar{display:flex;flex-wrap:wrap;gap:2px;padding:4px;justify-content:flex-end}
#toolbar>button{width:78px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:600}
#buildmenu{padding:6px;display:flex;flex-direction:column;gap:2px;width:240px}
#buildmenu button{text-align:left;padding:8px 10px;min-height:44px;display:flex;flex-direction:column}
#buildmenu .c{font-size:13px;color:var(--dim)}
.paused{padding:8px 16px;font-weight:650}
#speed .menu-btn{width:auto;padding:0 12px;gap:8px}
#speed .sep{width:1px;background:var(--slate-deep);margin:6px 4px}
.menu-back{position:fixed;inset:0;z-index:20;background:rgba(35,44,41,0.55);display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.menu{width:440px;max-width:100%;max-height:100%;overflow:auto;box-sizing:border-box;padding:22px 22px 20px;display:flex;flex-direction:column;gap:16px}
.menu h2{margin:0;font-size:34px;font-weight:780;font-stretch:76%;line-height:1}
.menu .sub{margin-top:4px}
.menu-actions{display:flex;flex-direction:column;gap:6px}
.menu-actions>button{min-height:48px;text-align:left;padding:0 16px;border-color:var(--dim);font-size:17px;font-weight:650}
.menu-actions>button.primary{border-color:var(--chalk);background:var(--slate-deep)}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--slate-deep);border-radius:6px;padding:10px 12px;background:rgba(35,44,41,0.5)}
.slot .meta{display:flex;flex-direction:column;gap:1px;min-width:0}
.slot .sn{font-weight:700}
.slot button{min-height:40px;padding:0 14px;border-color:var(--chalk);flex:none}
.slot button:disabled{border-color:var(--slate-deep);color:var(--dim);cursor:default;background:transparent}
.confirm{border:1px solid var(--yellow);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm .btns{display:flex;gap:8px;flex-wrap:wrap}
.confirm button{min-height:40px;padding:0 14px;border-color:var(--dim)}
.confirm button.go{border-color:var(--yellow);color:var(--yellow)}
.menu .err{color:var(--yellow);font-weight:650}
kbd{font-family:inherit;font-size:13px;font-weight:700;color:var(--chalk);background:var(--slate-deep);border:1px solid #4A5752;border-bottom-width:2px;border-radius:4px;padding:1px 6px;white-space:nowrap}
.keys{display:flex;flex-direction:column;gap:6px}
.keys .gname{font-weight:700}
.krow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;font-size:14px}
.kbadge{position:absolute;top:3px;right:4px;font-size:11px;font-weight:700;color:var(--dim);line-height:1}
#toolbar>button{position:relative}
#buildmenu kbd{font-size:11px;padding:0 5px}
.menu .back{align-self:flex-start;min-height:40px;padding:0 12px;border-color:var(--dim)}
[hidden]{display:none!important}
@media (max-width:760px){
  #goals{width:240px}
  #goals li:not(.now):not(.done){display:none}
  #stuck{width:200px}
  #toasts{max-width:100%;top:auto;bottom:230px}
  #sel{width:260px}
  #toolbar>button{width:64px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="world" aria-label="Village map. Use the orders toolbar, then click trees, boulders or open ground."></canvas>

<div class="hud"><div class="hud-inner">
  <div class="corner tl">
    <div class="panel" id="tallies" aria-label="Materials">
      <div id="mats" style="display:contents"></div>
      <div class="tools-wrap">
        <button class="tally tools-btn" aria-haspopup="true" aria-describedby="toolsList">
          <svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><path d="M4 18L13 6" stroke="#9C7A4E" stroke-width="2.5" stroke-linecap="round"/><path d="M8 3.5Q13 1.5 16.5 5L13 6Z" fill="#8A8D86" stroke="#232C29" stroke-width="1"/></svg>
          <span class="row" style="gap:6px"><span class="dim" style="font-size:14px">Tools</span><span class="n num" id="toolsN">0</span></span>
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5L5 6.5L8 3.5" fill="none" stroke="#B3B8AF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="tools-drop"><div class="panel" id="toolsList" role="tooltip"></div></div>
      </div>
    </div>
    <div class="panel" id="goals"></div>
  </div>
  <div class="corner tr">
    <div class="panel" id="speed" role="group" aria-label="Game speed">
      <button data-a="menu" class="menu-btn" aria-haspopup="dialog" title="Menu (Esc or M)" aria-keyshortcuts="Escape M"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4H13.5M2.5 8H13.5M2.5 12H13.5" stroke="#ECEAE2" stroke-width="2" stroke-linecap="round"/></svg>Menu</button>
      <span class="sep" aria-hidden="true"></span>
      <button data-a="speed:0" aria-label="Pause" title="Pause (~ or Space)" aria-keyshortcuts="Shift+` Space"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3V13M11 3V13" stroke="#ECEAE2" stroke-width="2.5" stroke-linecap="round"/></svg></button>
      <button data-a="speed:1" title="Speed 1× (1)" aria-keyshortcuts="1">1×</button>

    </div>
    <div class="panel" id="stuck" hidden></div>
  </div>
  <div id="toasts"></div>
  <div class="corner bl"><div class="panel" id="sel"></div></div>
  <div class="corner br">
    <div class="panel" id="buildmenu" hidden>
      <button data-a="place:bench" aria-keyshortcuts="T"><span style="font-weight:700;display:flex;justify-content:space-between;width:100%">Crafting bench <kbd>T</kbd></span><span class="c">4 logs</span></button>
      <button data-a="place:house" aria-keyshortcuts="H"><span style="font-weight:700;display:flex;justify-content:space-between;width:100%">House <kbd>H</kbd></span><span class="c">8 cobblestone, then 16 planks and 4 logs, then 12 planks</span></button>
    </div>
    <div class="panel" id="toolbar" role="toolbar" aria-label="Orders">
      <button data-a="tool:mine" title="Mine trees and boulders (X). Drag to mark many. Boulders need a pickaxe." aria-keyshortcuts="X"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#F25C54" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18L13.5 8.5"/><path d="M8 4.5Q14 2 18.5 7.5L15.5 9.5Q13 6 8 4.5Z"/></svg>Mine<span class="kbadge" aria-hidden="true">X</span></button>
      <button data-a="tool:stock" title="Paint a stockpile (Z). Drag over open ground." aria-keyshortcuts="Z"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#8CC084" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3H19V19H3Z M3 11L11 3 M3 19L19 3 M11 19L19 11"/></svg>Stockpile<span class="kbadge" aria-hidden="true">Z</span></button>
      <button data-a="tool:build" title="Build (B)" aria-keyshortcuts="B"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#6FA8DC" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M3 3H7M10 3H12M15 3H19V7M19 10V12M19 15V19H15M12 19H10M7 19H3V15M3 12V10M3 7V3"/></svg>Build<span class="kbadge" aria-hidden="true">B</span></button>
    </div>
  </div>
</div></div>

<div id="menu" class="menu-back" hidden>
  <div class="panel menu" role="dialog" aria-modal="true" aria-labelledby="menuTitle" id="menuBox"></div>
</div>

<script>
(function(){
'use strict';
// ---------- Tuning (provisional, mirrors slice-1-spec §11) ----------
var W = 18, H = 18, TPS = 20, DT = 1 / TPS;
var T = { walk: 3, carry: 4, stack: 16, boulder: 6, craft: 3, stage: 10, arrival: 45,
  chop: [20, 8, 5], brk: [0, 10, 6], dur: [0, 10, 25] };
var ITEMS = {
  log: { one: 'log', many: 'logs', label: 'Logs', col: '#7A5634' },
  plank: { one: 'plank', many: 'planks', label: 'Planks', col: '#C49A62' },
  stick: { one: 'stick', many: 'sticks', label: 'Sticks', col: '#9C7A4E' },
  cobble: { one: 'cobblestone', many: 'cobblestone', label: 'Cobblestone', col: '#7F827C' },
  wood_axe: { one: 'wooden axe', many: 'wooden axes', tool: 'axe', tier: 1, col: '#C49A62' },
  wood_pick: { one: 'wooden pickaxe', many: 'wooden pickaxes', tool: 'pick', tier: 1, col: '#C49A62' },
  stone_axe: { one: 'stone axe', many: 'stone axes', tool: 'axe', tier: 2, col: '#8A8D86' },
  stone_pick: { one: 'stone pickaxe', many: 'stone pickaxes', tool: 'pick', tier: 2, col: '#8A8D86' }
};
var RECIPES = [
  { id: 'planks', name: 'Planks', inp: { log: 1 }, out: { plank: 4 } },
  { id: 'sticks', name: 'Sticks', inp: { plank: 2 }, out: { stick: 4 } },
  { id: 'wood_axe', name: 'Wooden axe', inp: { plank: 3, stick: 2 }, out: { wood_axe: 1 } },
  { id: 'wood_pick', name: 'Wooden pickaxe', inp: { plank: 3, stick: 2 }, out: { wood_pick: 1 } },
  { id: 'stone_axe', name: 'Stone axe', inp: { cobble: 3, stick: 2 }, out: { stone_axe: 1 } },
  { id: 'stone_pick', name: 'Stone pickaxe', inp: { cobble: 3, stick: 2 }, out: { stone_pick: 1 } }
];
var RBY = {}; RECIPES.forEach(function (r) { RBY[r.id] = r; });
var TPL = {
  bench: { name: 'Crafting bench', w: 1, h: 1, stages: [{ name: 'Bench', verb: 'needs', cost: { log: 4 } }] },
  house: { name: 'House', w: 5, h: 5, stages: [
    { name: 'Foundation', verb: 'needs', cost: { cobble: 8 } },
    { name: 'Walls', verb: 'need', cost: { plank: 16, log: 4 } },
    { name: 'Roof', verb: 'needs', cost: { plank: 12 } }] }
};
var C = { grass: '#6F8F4E', dirt: '#7B5E42', stone: '#8A8D86', cobble: '#7F827C', log: '#7A5634', leaves: '#4E7A3A',
  plank: '#C49A62', roof: '#8E5E3C', legs: '#3A3B45', skin: '#D9A77C', chalk: '#ECEAE2', deep: '#232C29',
  red: '#F25C54', blue: '#6FA8DC', green: '#8CC084', yellow: '#E8C547', sky: '#A9B8B0' };
var DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

function words(type, n) { var it = ITEMS[type]; return n + ' ' + (n === 1 ? it.one : it.many); }
function costText(cost) { return Object.keys(cost).map(function (k) { return words(k, cost[k]); }).join(', '); }
function key(x, y) { return x + ',' + y; }
function idx(x, y) { return y * W + x; }

// ---------- World ----------
var S, occ = new Uint8Array(W * H), occDirty = true;

function newGame() {
  S = { tick: 0, speed: 1, nextId: 1, trees: [], boulders: [], items: {}, zone: {}, zoneRes: {}, sites: [], residents: [],
    stats: { felled: 0, broken: 0, pick: false, house: 0, division: false }, arrivalAt: null, arrived: false,
    toasts: [], stuck: [], autoCraft: false };
  [[2, 9], [3, 13], [12, 2], [2, 3], [6, 12], [15, 6], [9, 15], [15, 13], [6, 2], [16, 9], [13, 16], [1, 16], [9, 2], [4, 6]]
    .forEach(function (p, i) { S.trees.push({ id: S.nextId++, kind: 'tree', x: p[0], y: p[1], logs: 4 + (i * 7) % 3, alive: true, des: false, claim: null }); });
  [[11, 12], [14, 10], [7, 5], [10, 4], [16, 3], [7, 16]]
    .forEach(function (p) { S.boulders.push({ id: S.nextId++, kind: 'boulder', x: p[0], y: p[1], alive: true, des: false, claim: null }); });
  addResident('Ada', '#3E6E7E', 9, 9);
  occDirty = true;
  ui.sel = { kind: 'res', ids: [S.residents[0].id] };
  ui.tool = null; ui.place = null;
}
function addResident(name, shirt, x, y) {
  var r = { id: S.nextId++, kind: 'res', name: name, shirt: shirt, x: x, y: y, path: [], job: null, direct: null,
    carry: null, axe: null, pick: null, broken: { axe: false, pick: false }, progress: null, note: null };
  S.residents.push(r); return r;
}
function resById(id) { for (var i = 0; i < S.residents.length; i++) if (S.residents[i].id === id) return S.residents[i]; return null; }
function siteById(id) { for (var i = 0; i < S.sites.length; i++) if (S.sites[i].id === id) return S.sites[i]; return null; }
function siteCells(s) { var out = []; for (var x = s.x0; x < s.x0 + s.w; x++) for (var y = s.y0; y < s.y0 + s.h; y++) out.push([x, y]); return out; }
function siteBlocks(s) { return s.done || (s.tpl === 'house' && s.stage >= 1); }

function recomputeOcc() {
  occ.fill(0);
  S.trees.forEach(function (t) { if (t.alive) occ[idx(t.x, t.y)] = 1; });
  S.boulders.forEach(function (b) { if (b.alive) occ[idx(b.x, b.y)] = 1; });
  S.sites.forEach(function (s) { if (siteBlocks(s)) siteCells(s).forEach(function (c) { occ[idx(c[0], c[1])] = 1; }); });
  occDirty = false;
}
function walkable(x, y) {
  if (x < 0 || y < 0 || x >= W || y >= H) return false;
  if (occDirty) recomputeOcc();
  return !occ[idx(x, y)];
}
function bfs(sx, sy, goals) {
  var start = idx(sx, sy); if (goals.has(start)) return [];
  var prev = new Int32Array(W * H).fill(-2); prev[start] = -1;
  var q = [start], qi = 0;
  while (qi < q.length) {
    var c = q[qi++], cx = c % W, cy = (c / W) | 0;
    for (var d = 0; d < 4; d++) {
      var nx = cx + DIRS[d][0], ny = cy + DIRS[d][1];
      if (!walkable(nx, ny)) continue;
      var n = idx(nx, ny); if (prev[n] !== -2) continue;
      prev[n] = c;
      if (goals.has(n)) { var path = [], p = n; while (p !== start) { path.unshift(p); p = prev[p]; } return path; }
      q.push(n);
    }
  }
  return null;
}
function cellSet(cells) { var s = new Set(); cells.forEach(function (c) { if (walkable(c[0], c[1])) s.add(idx(c[0], c[1])); }); return s; }
function adjSet(cells) {
  var inside = new Set(cells.map(function (c) { return idx(c[0], c[1]); })), s = new Set();
  cells.forEach(function (c) { DIRS.forEach(function (d) { var x = c[0] + d[0], y = c[1] + d[1]; if (walkable(x, y) && !inside.has(idx(x, y))) s.add(idx(x, y)); }); });
  return s;
}
function rcell(r) { return [Math.round(r.x), Math.round(r.y)]; }

// ---------- Items ----------
// A tool keeps `uses` (its remaining uses); leave it out for a new tool.
function dropItems(x, y, type, n, uses) {
  if (occDirty) recomputeOcc();
  var seen = new Set([idx(x, y)]), q = [[x, y]], qi = 0, guard = 0;
  while (n > 0 && qi < q.length && guard++ < 400) {
    var c = q[qi++], k = key(c[0], c[1]), s = S.items[k];
    if (walkable(c[0], c[1]) || (c[0] === x && c[1] === y && !occ[idx(x, y)])) {
      var cap = ITEMS[type].tool ? 1 : T.stack;
      if (!s) { var m = Math.min(n, cap); S.items[k] = { x: c[0], y: c[1], type: type, n: m, res: 0 }; if (ITEMS[type].tool) S.items[k].dur = uses == null ? T.dur[ITEMS[type].tier] : uses; n -= m; }
      else if (s.type === type && s.n < cap) { var a = Math.min(n, cap - s.n); s.n += a; n -= a; }
    }
    DIRS.forEach(function (d) { var nx = c[0] + d[0], ny = c[1] + d[1], ni = idx(nx, ny);
      if (nx >= 0 && ny >= 0 && nx < W && ny < H && !seen.has(ni) && walkable(nx, ny)) { seen.add(ni); q.push([nx, ny]); } });

      '<div class="row"><span class="dim">Carrying</span><span>' + (r.carry ? words(r.carry.type, r.carry.n) : 'Nothing') + '</span></div>' +

      (!r.axe && !r.broken.axe ? '<div class="dim">Chopping by hand is slow. Stone needs a pickaxe.</div>' : '');
  }
  var o = selObj();
  if (!o) return '<div class="dim">That’s gone.</div>';
  if (o.kind === 'tree') return '<div class="row"><span class="name">Tree</span><span class="dim">Drops ' + o.logs + ' logs</span></div><button class="ghost-btn" data-a="des" style="align-self:flex-start;min-height:44px">' + (o.des ? 'Cancel mining' : 'Mine') + '</button>';
  if (o.kind === 'boulder') {
    var bs = S.stuck.filter(function (s) { return s.focus && s.focus.kind === 'boulder'; });
    return '<div class="row"><span class="name">Boulder</span><span class="dim">Drops 6 cobblestone</span></div>' + (o.des && bs.length ? '<div class="reason">' + FLAG + 'Needs a pickaxe</div>' : '') + '<button class="ghost-btn" data-a="des" style="align-self:flex-start;min-height:44px">' + (o.des ? 'Cancel mining' : 'Mine') + '</button>';
  }
  var tpl = TPL[o.tpl], reasons2 = S.stuck.filter(function (s) { return s.focus && s.focus.kind === 'site' && s.focus.id === o.id; });
  if (!o.done) {
    var st = tpl.stages[o.stage], rows = '';
    for (var k in st.cost) {
      var have = o.store[k] || 0, need = st.cost[k];
      rows += '<div style="display:flex;flex-direction:column;gap:4px"><div class="row"><span>' + ITEMS[k].label + '</span><span class="num">' + have + ' / ' + need + '</span></div><div class="bar"><i style="width:' + Math.round(100 * have / need) + '%"></i></div></div>';
    }
    var stageLine = tpl.stages.length > 1 ? 'Stage ' + (o.stage + 1) + ' of ' + tpl.stages.length + ': ' + st.name.toLowerCase() : 'Blueprint';
    var nextSt = tpl.stages[o.stage + 1];
    var ob = siteObstacles(o), clearing = footprintClear(o) ? '' : '<div>Clearing the ground first: ' + clearingText(ob) + '.</div>';
    return '<div class="row"><span class="name">' + tpl.name + '</span><span class="dim">' + stageLine + '</span></div>' + clearing + rows +
      reasons2.map(function (s) { return '<div class="reason">' + FLAG + esc(s.why) + '</div>'; }).join('') +
      (o.builder ? '<div class="dim">' + esc(resById(o.builder).name) + ' is building.</div>' : '') +
      (nextSt ? '<div class="dim">' + nextSt.name + ' next: ' + costText(nextSt.cost) + '.</div>' : '') +
      '<button class="ghost-btn" data-a="cancelsite:' + o.id + '" style="align-self:flex-start;min-height:40px">Cancel blueprint</button>';
  }
  if (o.tpl === 'house') {
    var owner = o.owner ? resById(o.owner) : null;
    return '<div class="name">House</div><div class="dim">' + (owner ? 'Home of ' + esc(owner.name) + '.' : S.arrivalAt !== null && !S.arrived ? 'Empty. A traveler should arrive soon.' : 'Empty.') + '</div>';
  }
  // bench
  var ai = benchActive(o), ready = benchCraftable(o), head = o.queue.length ? RBY[o.queue[ai >= 0 ? ai : 0]] : null, status = 'Nothing queued';
  if (o.crafting) status = 'Crafting ' + o.crafting.toLowerCase();
  else if (ready) status = 'Ready to craft ' + ready.name.toLowerCase();
  else if (head) {
    var missing = [];
    for (var ik in head.inp) { var h2 = o.store[ik] || 0; if (h2 < head.inp[ik]) missing.push(words(ik, head.inp[ik] - h2)); }
    status = (ai >= 0 ? 'Gathering ' : 'Waiting for ') + missing.join(', ') + ' for ' + head.name.toLowerCase();
  }
  return '<div class="row"><span class="name">Crafting bench</span><span class="dim">' + esc(status) + '</span></div>' +
    reasons2.map(function (s) { return '<div class="reason">' + FLAG + esc(s.why) + '</div>'; }).join('') +
    '<div class="recipes">' + RECIPES.map(function (rc) {
      return '<div class="recipe"><span><span style="font-weight:650">' + rc.name + '</span><br><span class="dim" style="font-size:13px">' + costText(rc.inp) + ' → ' + costText(rc.out) + '</span></span><button data-a="queue:' + o.id + ':' + rc.id + '">Queue</button></div>';
    }).join('') + '</div>' +
    (o.queue.length ? '<div class="dim" style="font-size:13px">Queue. Items that can’t be made yet are skipped. Click one to remove it.</div><div class="queue">' + o.queue.map(function (q, i) {
      var can = i === ai || (ready && ready.id === q && o.queue.indexOf(q) === i), auto = o.autoq && o.autoq[i];
      return '<button data-a="unqueue:' + o.id + ':' + i + '" aria-label="Remove ' + RBY[q].name + ' from queue"' + (can ? ' style="border-color:var(--chalk);font-weight:700"' : '') + '>' + RBY[q].name + (auto ? ' <span class="dim">(auto)</span>' : '') + ' ×</button>';
    }).join('') + '</div>' : '') +
    '<div class="dim" style="font-size:13px">' + (S.autoCraft ? 'Missing planks and sticks are queued automatically.' : 'Once Ada’s house is finished, the bench queues the planks and sticks a recipe needs.') + '</div>';
}

// ---------- Saving ----------
// Saves go to this player's private per-viewer storage when the page has it, else to this browser.
var SLOTS = 5, SAVE_V = 1;
var store = { kind: 'local', db: null, uid: null };
(function connectStore() {
  var c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  Promise.all([c.use('db'), c.use('user')]).then(function (res) {
    var db = res[0], user = res[1];
    if (!db || !user) return null;
    return user.id().then(function (uid) { if (uid) { store.kind = 'db'; store.db = db; store.uid = uid; if (ui.menu && ui.menu.slots) loadSlots(); } });
  }).catch(function () {});
})();
function slotRef(i) { return store.db.collection('data/users/' + store.uid).doc('save' + i); }
function readSlot(i) {
  if (store.kind === 'db') return slotRef(i).get().then(function (s) { return s.exists ? s.data() : null; });
  try { var v = localStorage.getItem('bv-save-' + i); return Promise.resolve(v ? JSON.parse(v) : null); } catch (e) { return Promise.resolve(null); }
}
function writeSlot(i, body) {
  if (store.kind === 'db') return slotRef(i).set(body);
  try { localStorage.setItem('bv-save-' + i, JSON.stringify(body)); return Promise.resolve(); } catch (e) { return Promise.reject(e); }
}
var SKIP = { job: 1, direct: 1, path: 1, toasts: 1, stuck: 1 };
function serialize() {
  var speed = S.speed; S.speed = ui.menu && ui.menu.prevSpeed !== undefined ? ui.menu.prevSpeed : S.speed;
  var json = JSON.stringify({ S: S, cam: { x: camCenter()[0], y: camCenter()[1], z: cam.z } }, function (k, v) { return SKIP[k] ? undefined : v; });
  S.speed = speed;
  return json;
}
function camCenter() { var u = (vw / 2 - cam.ox) / (32 * cam.z), v = (vh / 2 - 40 * cam.z - cam.oy) / (16 * cam.z); return [(u + v) / 2, (v - u) / 2]; }
function restore(json) {
  var o = JSON.parse(json), s = o.S;
  s.toasts = []; s.stuck = []; s.zoneRes = {};
  for (var k in s.items) s.items[k].res = 0;
  s.sites.forEach(function (x) { x.incoming = {}; x.builder = null; x.crafter = null; x.crafting = null; if (!x.autoq) x.autoq = x.queue.map(function () { return false; }); });
  s.trees.concat(s.boulders).forEach(function (x) { x.claim = null; x.unreachUntil = 0; });
  S = s; occDirty = true;
  S.residents.forEach(function (r) {
    r.job = null; r.direct = null; r.path = []; r.progress = null; r.note = null;
    r.x = Math.round(r.x); r.y = Math.round(r.y);
    if (r.carry) { dropItems(r.x, r.y, r.carry.type, r.carry.n, r.carry.dur); r.carry = null; }
    if (r.arriving) walkIn(r);
  });
  ui.sel = null; ui.tool = null; ui.place = null; ui.buildOpen = false;
  if (o.cam) { cam.z = o.cam.z; centerOn(o.cam.x, o.cam.y); }
  computeStuck();
}
function progressText(st) {
  var next = null;
  for (var i = 0; i < GOALS.length; i++) if (!GOALS[i].ok.call(null, st)) { next = GOALS[i].t; break; }
  return next ? 'Next: ' + next : 'Founding complete';
}
function playedText(tick) { var m = Math.floor(tick / TPS / 60); return m < 1 ? 'Under a minute played' : m === 1 ? '1 minute played' : m + ' minutes played'; }
function whenText(iso) { try { return new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); } catch (e) { return ''; } }

// ---------- Menu ----------
function openMenu(view) {
  if (!ui.menu) ui.menu = { prevSpeed: S.speed };
  ui.menu.view = view || 'main'; ui.menu.confirm = null; ui.menu.msg = null;
  S.speed = 0;
  if (ui.menu.view === 'save' || ui.menu.view === 'load') loadSlots();
  renderMenu();
}
function closeMenu() {
  if (!ui.menu) return;
  S.speed = ui.menu.first ? 1 : ui.menu.prevSpeed; ui.menu = null;
  document.getElementById('menu').hidden = true; refreshHud(true);
}
function loadSlots() {
  ui.menu.slots = null; renderMenu();
  var reads = []; for (var i = 1; i <= SLOTS; i++) reads.push(readSlot(i).catch(function () { return { error: true }; }));
  Promise.all(reads).then(function (list) { if (ui.menu) { ui.menu.slots = list; renderMenu(); } });
}
function renderMenu() {
  var m = ui.menu, box = document.getElementById('menuBox'), back = document.getElementById('menu');
  if (!m) { back.hidden = true; return; }
  back.hidden = false;
  var h = '';
  if (m.view === 'main') {
    h += '<div><h2 id="menuTitle">Block Village</h2><div class="sub dim">The founding. ' + esc(progressText()) + '.</div></div>';
    h += '<div class="menu-actions">' +
      '<button class="primary" data-a="m:resume">' + (m.first ? 'Play' : 'Resume') + '</button>' +
      '<button data-a="m:view:save">Save game</button>' +
      '<button data-a="m:view:load">Load game</button>' +
      '<button data-a="m:view:keys">Controls</button>' +
      '<button data-a="m:ask:restart">Start over</button></div>';
    if (m.confirm) h += confirmHtml(m.confirm);
    h += '<div class="dim" style="font-size:13px">' + (store.kind === 'db' ? 'Saves are kept with your account on this page.' : 'Saves are kept in this browser.') + ' Esc or M opens this menu.</div>';
  } else if (m.view === 'keys') {
    h += '<div><h2 id="menuTitle">Controls</h2><div class="sub dim">Press ? in the game to open this list.</div></div>';
    h += KEY_LIST.map(function (g) {
      return '<div class="keys"><div class="gname">' + g[0] + '</div>' + g[1].map(function (r) {
        return '<div class="krow"><span class="kk">' + r[0].split(' or ').map(function (p) { return '<kbd>' + esc(p) + '</kbd>'; }).join(' ') + '</span><span>' + esc(r[1]) + '</span></div>';
      }).join('') + '</div>';
    }).join('');
    h += '<button class="back" data-a="m:view:main">Back</button>';
  } else {
    var saving = m.view === 'save';
    h += '<div><h2 id="menuTitle">' + (saving ? 'Save game' : 'Load game') + '</h2><div class="sub dim">' + (saving ? 'Choose a slot. Saving over a slot replaces it.' : 'Choose a save to continue from.') + '</div></div>';
    if (!m.slots) h += '<div class="dim">Reading saves…</div>';
    else {
      h += '<div class="slots">' + m.slots.map(function (sl, i) {
        var n = i + 1, empty = !sl || sl.error, meta;
        if (sl && sl.error) meta = '<span class="err" style="font-size:14px">Couldn’t read this slot</span>';
        else if (!sl) meta = '<span class="dim">Empty</span>';
        else meta = '<span>' + esc(sl.summary || '') + '</span><span class="dim" style="font-size:13px">' + esc(playedText(sl.tick || 0)) + '. Saved ' + esc(whenText(sl.savedAt)) + '</span>';
        var btn = saving ? '<button data-a="m:' + (empty ? 'save' : 'ask:save') + ':' + n + '">' + (empty ? 'Save here' : 'Save over') + '</button>'
          : '<button data-a="m:ask:load:' + n + '"' + (empty ? ' disabled' : '') + '>Load</button>';
        return '<div class="slot"><div class="meta"><span class="sn">Slot ' + n + '</span>' + meta + '</div>' + btn + '</div>';
      }).join('') + '</div>';
    }
    if (m.confirm) h += confirmHtml(m.confirm);
    if (m.msg) h += '<div class="' + (m.msg.err ? 'err' : 'dim') + '">' + esc(m.msg.text) + '</div>';
    h += '<button class="back" data-a="m:view:main">Back</button>';
  }
  box.innerHTML = h;
  var first = box.querySelector('.confirm button.go') || box.querySelector('button.primary') || box.querySelector('button');
  if (first && document.activeElement && !box.contains(document.activeElement)) first.focus();
}
function confirmHtml(c) {
  return '<div class="confirm" role="alert"><div>' + esc(c.text) + '</div><div class="btns"><button class="go" data-a="m:do:' + c.action + '">' + esc(c.yes) + '</button><button data-a="m:cancel">Cancel</button></div></div>';
}
function menuAction(parts) {
  var m = ui.menu; if (!m) return;
  var a = parts[1];
  if (a === 'resume') return closeMenu();
  if (a === 'view') return openMenu(parts[2]);
  if (a === 'cancel') { m.confirm = null; return renderMenu(); }
  if (a === 'ask') {
    var what = parts[2], n = parts[3];
    if (what === 'restart') m.confirm = { text: 'Start a new game? Anything you haven’t saved will be lost.', yes: 'Start over', action: 'restart' };
    if (what === 'save') m.confirm = { text: 'Save over slot ' + n + '? The save that’s there now will be replaced.', yes: 'Save over slot ' + n, action: 'save:' + n };
    if (what === 'load') m.confirm = { text: 'Load slot ' + n + '? Anything you haven’t saved will be lost.', yes: 'Load slot ' + n, action: 'load:' + n };
    return renderMenu();
  }
  if (a === 'do') return menuAction(['m'].concat(parts.slice(2)));
  if (a === 'restart') { newGame(); fitCamera(); m.prevSpeed = 1; m.first = false; closeMenu(); return; }
  if (a === 'save') {
    var slot = +parts[2];
    m.confirm = null; m.msg = { text: 'Saving to slot ' + slot + '…' }; renderMenu();
    var body = { v: SAVE_V, savedAt: new Date().toISOString(), tick: S.tick, summary: progressText(), state: serialize() };
    writeSlot(slot, body).then(function () {
      if (!ui.menu) return;
      ui.menu.slots[slot - 1] = body; ui.menu.msg = { text: 'Saved to slot ' + slot + '.' }; renderMenu();
    }, function (e) {
      if (!ui.menu) return;
      var why = e && e.code === 'quota_exceeded' ? 'The save storage is full.' : 'Try again in a moment.';
      ui.menu.msg = { text: 'Couldn’t save to slot ' + slot + '. ' + why, err: true }; renderMenu();
    });
    return;
  }
  if (a === 'load') {
    var ls = +parts[2], data = m.slots && m.slots[ls - 1];
    if (!data || !data.state) { m.confirm = null; m.msg = { text: 'Slot ' + ls + ' is empty.', err: true }; return renderMenu(); }
    try { restore(data.state); } catch (e) { m.confirm = null; m.msg = { text: 'Slot ' + ls + ' couldn’t be loaded. The save may be from an older version.', err: true }; return renderMenu(); }
    m.prevSpeed = S.speed || 1; m.first = false;
    closeMenu(); toast('Loaded slot ' + ls + '.'); refreshHud(true);
  }
}

// ---------- Loop ----------
var acc = 0, lastT = performance.now(), hudT = 0;
function frame(t) {
  var dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
  var pan = 600 * dt;
  if (ui.keys.w || ui.keys.arrowup) cam.oy += pan; if (ui.keys.s || ui.keys.arrowdown) cam.oy -= pan;
  if (ui.keys.a || ui.keys.arrowleft) cam.ox += pan; if (ui.keys.d || ui.keys.arrowright) cam.ox -= pan;
  acc += dt * S.speed; var n = 0;
  while (acc >= DT && n < 30) { step(); acc -= DT; n++; }
  render();
  hudT += dt; if (hudT > 0.2) { hudT = 0; refreshHud(); }
  requestAnimationFrame(frame);
}
resize(); newGame(); fitCamera(); refreshHud(true);
ui.menu = { prevSpeed: 1, first: true }; openMenu('main');
requestAnimationFrame(frame);
})();
</script>
